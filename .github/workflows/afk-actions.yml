name: afk-actions

# El bot de UNA cuenta (rol solo) corriendo en GitHub Actions contra el server real, en tandas.
# Cada tanda: arma el kit de deploy/vps (minecadia-client, privado: se baja con MINECADIA_READ_TOKEN y nunca se sube),
# recupera el estado cifrado de la tanda anterior (almacen Postgres, login Microsoft, logs), corre el bot unas horas,
# lo apaga con las compras cerradas, guarda el estado cifrado y lanza la tanda siguiente.
#
# Modos (Actions > afk-actions > Run workflow):
#   login   muestra el codigo de microsoft.com/link; entras con la cuenta del bot una sola vez y queda guardado
#   correr  corre el bot; si la variable AFK_ON es 1, al terminar la tanda lanza la siguiente sola
#   prueba  lo mismo contra el emulador (sin secrets del server): corta a mitad, guarda, borra todo, recupera y sigue
#
# Secrets (Settings > Secrets and variables > Actions):
#   MINECADIA_READ_TOKEN  token de solo lectura de minecadia-client (ya esta)
#   AFK_CLAVE             una frase larga cualquiera: cifra el estado guardado entre tandas
#   AFK_SERVER            direccion del server (ej. play.minecadia.com)
#   AFK_INICIO            el inicio.txt: ir a la base y las 5 zonas de cofres (;cz ...), ;cz pipeline on, ;toggle PipelineBot on
#   AFK_OBJETIVO          el set (objetivo .set), con #!config budget.cap=... y topes price.*
# Proxys (opcional; con cualquiera de los dos, la cuenta NUNCA entra al server sin proxy):
#   AFK_PROXY_FUENTES     URLs de listas de proxys que se actualizan solas (una por linea, p. ej. socks5.txt de un repo)
#   AFK_PROXIES           proxys propios, uno por linea (socks5://usuario:clave@host:puerto, host:puerto:usuario:clave...)
#   El vigia (tools/proxy/proxy-vigia.py) los prueba contra el server cada minuto y la cuenta toma el mejor sano;
#   si se le cae, salta al siguiente. Con una segunda cuenta logueada como "vigia" (modo login, cuenta vigia), esa
#   cuenta entra de verdad por cada proxy para ver cuales deja pasar el server; nunca compra nada.
# Variable: AFK_ON = 1 para que siga solo tanda tras tanda; 0 (o borrarla) para que pare al terminar la tanda actual.
#
# En este repo los logs son publicos: aca solo se imprime un resumen (progreso del set, compras, plata),
# nunca la config, las coordenadas ni los logs del juego (van dentro del estado cifrado).

on:
  push:   # un push a afk-run.txt o a este archivo corre el modo prueba (nunca el server real)
    paths: ["afk-run.txt", "afk-guardar.sh", "afk-resumen.sh", ".github/workflows/afk-actions.yml"]
  workflow_dispatch:
    inputs:
      modo:
        description: login, correr o prueba
        default: correr
        type: choice
        options: [correr, login, prueba]
      horas:
        description: horas de juego en esta tanda (maximo 5.5)
        default: '5.5'
      cuenta:
        description: 'solo para login: solo (la que compra) o vigia (la que prueba proxys)'
        type: choice
        default: solo
        options: [solo, vigia]
      set_nuevo:
        description: empezar un set nuevo (borra el progreso guardado del set; el login queda)
        type: boolean
        default: false

concurrency:
  group: afk-actions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # para lanzar la tanda siguiente
  pull-requests: write    # avisos: un comentario en el PR "avisos" despierta a Claude
  issues: write

jobs:
  tanda:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      AFK_CONTROL: ${{ vars.AFK_CONTROL || 'claude/project-thread-9ah29y' }}
      MODO_AFK: ${{ inputs.modo || (github.event_name == 'push' && 'prueba') || 'correr' }}
      PGHOST: 127.0.0.1
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Kit (privado, no se guarda)
        env:
          TOKEN: ${{ secrets.MINECADIA_READ_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "falta el secret MINECADIA_READ_TOKEN"; exit 1; }
          KIT=$(sed -n 1p afk-run.txt | tr -d '[:space:]'); BASE=$(sed -n 2p afk-run.txt | tr -d '[:space:]')
          H="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q /tmp/src
          git -C /tmp/src -c http.extraheader="$H" fetch -q --depth 1 --no-tags https://github.com/reidethebest/minecadia-client.git "$KIT"
          git -C /tmp/src log -1 --format='kit %h' FETCH_HEAD
          git -C /tmp/src archive FETCH_HEAD deploy/vps | tar x
          # cuenta vigia (prueba proxys): un rol mas, solo con VIGIA=1 en bots.env; el comprador sigue siendo solo
          sed -i '/^COMPRADOR=sniper/a [ "${VIGIA:-0}" = 1 ] \&\& ROLES="$ROLES vigia" || true' deploy/vps/bots.sh
          grep -q 'ROLES="$ROLES vigia"' deploy/vps/bots.sh || { echo "no pude agregar el rol vigia al kit"; exit 1; }
          if [ "$MODO_AFK" = prueba ]; then
            git -C /tmp/src -c http.extraheader="$H" fetch -q --depth 1 --no-tags https://github.com/reidethebest/minecadia-client.git "$BASE"
            git -C /tmp/src archive FETCH_HEAD tools/MinecadiaEmu | tar x
          fi
          # canal de control privado: afk/objetivo.set y afk/comandos.txt de la rama AFK_CONTROL (si existe)
          if [ "$MODO_AFK" != prueba ] && [ -n "$AFK_CONTROL" ]; then
            if git -C /tmp/src -c http.extraheader="$H" fetch -q --depth 1 --no-tags https://github.com/reidethebest/minecadia-client.git "$AFK_CONTROL" 2>/dev/null; then
              mkdir -p /tmp/control; git -C /tmp/src archive FETCH_HEAD afk 2>/dev/null | tar x -C /tmp/control 2>/dev/null || true
              [ "$(head -1 /tmp/control/afk/seguir.txt 2>/dev/null | tr -d '[:space:]')" = 1 ] && echo "SEGUIR=1" >> "$GITHUB_ENV"
              echo "control: $(git -C /tmp/src log -1 --format=%h FETCH_HEAD), objetivo $([ -s /tmp/control/afk/objetivo.set ] && echo si || echo no), comandos $([ -s /tmp/control/afk/comandos.txt ] && echo si || echo no)"
            else echo "control: sin rama de control, uso los secrets"; fi
          fi
          if [ "$MODO_AFK" = prueba ]; then mkdir -p /tmp/control/afk; printf 'estado\n# comentario\n' > /tmp/control/afk/comandos.txt; fi
          rm -rf /tmp/src

      - name: Config (de los secrets; nada se imprime)
        working-directory: deploy/vps
        env:
          S_SERVER: ${{ secrets.AFK_SERVER }}
          S_INICIO: ${{ secrets.AFK_INICIO }}
          S_OBJETIVO: ${{ secrets.AFK_OBJETIVO }}
          S_CLAVE: ${{ secrets.AFK_CLAVE }}
          S_TOK: ${{ secrets.MINECADIA_READ_TOKEN }}
        run: |
          umask 077
          # sin secret AFK_CLAVE: la clave del estado cifrado sale del secret MINECADIA_READ_TOKEN (solo Actions la conoce).
          # Ojo: si despues se crea AFK_CLAVE, el estado viejo no se puede abrir y hay que loguear de nuevo.
          [ -n "$S_CLAVE" ] || S_CLAVE=$(printf 'afk-estado:%s' "$S_TOK" | sha256sum | cut -c1-64)
          # server / inicio de la rama de control privada si no estan como secrets
          [ -n "$S_SERVER" ] || S_SERVER=$(head -1 /tmp/control/afk/server.txt 2>/dev/null | tr -d '[:space:]')
          [ -n "$S_INICIO" ] || S_INICIO=$(cat /tmp/control/afk/inicio.txt 2>/dev/null || true)
          [ -n "$S_OBJETIVO" ] || [ ! -s /tmp/control/afk/objetivo.set ] || S_OBJETIVO=$(cat /tmp/control/afk/objetivo.set || true)
          cp config/bots.env.example config/bots.env
          BASE=$(sed -n 2p ../../afk-run.txt | tr -d '[:space:]'); MOD=$(sed -n 3p ../../afk-run.txt | tr -d '[:space:]')
          sed -i -e 's/^MODO=.*/MODO=nativo/' -e 's/^UNA_CUENTA=.*/UNA_CUENTA=1/' -e 's/^PG_PASS=.*/PG_PASS=pipeline/' \
            -e 's/^RAM=.*/RAM=2048m/' -e "s#^RAMA_BASE=.*#RAMA_BASE=$BASE#" config/bots.env
          [ -n "$MOD" ] && sed -i "s#^RAMAS_MODULOS=.*#RAMAS_MODULOS=$MOD#" config/bots.env
          echo SIN_SYSTEMD=1 >> config/bots.env
          if [ "$MODO_AFK" = prueba ]; then
            E2E=../../tools/MinecadiaEmu/e2e
            # prueba: dos clientes (comprador y vigia) mas Spigot en el mismo runner, con menos memoria cada uno
            sed -i 's/^RAM=.*/RAM=1280m/' config/bots.env
            sed -i -e 's/^SERVER=.*/SERVER=127.0.0.1/' -e 's/^AUTH=.*/AUTH=offline/' -e 's/^CUENTA_SOLO=.*/CUENTA_SOLO=Solo/' \
              -e 's/^SIN_MUNDO_MIN=.*/SIN_MUNDO_MIN=6/' config/bots.env
            # como en el server real: sin cofres, todo en /pv 1..15 (PlayerVaults); el bot los abre por comando
            printf 'wait 200\ncmd ;toggle PipelineBot on\n' > config/inicio.txt
            { cat $E2E/target-clon-leggings.tsv; echo '#!config pv=1-2:BOTTLES,3-10:RUNES_OUT,11-12:DELIVERY,13:STAGING,14-15:STORAGE'; } > config/objetivo.set
            echo "export AFK_CLAVE=${S_CLAVE:-prueba-sin-clave}" > ../../.clave
          else
            if [ "$MODO_AFK" != login ]; then
              for v in S_SERVER S_INICIO S_OBJETIVO; do [ -n "${!v}" ] || { echo "falta ${v/S_/AFK_} (secret o rama de control)"; exit 1; }; done
            fi
            sed -i "s#^SERVER=.*#SERVER=$S_SERVER#" config/bots.env
            printf '%s\n' "$S_INICIO" > config/inicio.txt
            printf '%s\n' "$S_OBJETIVO" > config/objetivo.set
            if [ -s /tmp/control/afk/objetivo.set ]; then cp /tmp/control/afk/objetivo.set config/objetivo.set; echo "objetivo: de la rama de control"; fi
            echo "export AFK_CLAVE=$S_CLAVE" > ../../.clave
          fi
          # la cuenta vigia solo entra, se queda 2 minutos y sale (el vigilante la vuelve a lanzar con el proximo proxy)
          printf 'wait 2400\nquit\n' > config/inicio-vigia.txt
          [ "$MODO_AFK" = login ] && [ "${{ inputs.cuenta }}" = vigia ] && echo VIGIA=1 >> config/bots.env
          echo "config lista: $(wc -l < config/inicio.txt) lineas de inicio, $(grep -cvE '^\s*(#|$)' config/objetivo.set) lineas de objetivo"

      - name: Restaurar Minecraft (vanilla, sin nada privado)
        uses: actions/cache/restore@v4
        with:
          path: deploy/vps/data/shared
          key: afk-mc-forge-1.8.9-v1

      - name: Restaurar el estado de la tanda anterior (cifrado)
        uses: actions/cache/restore@v4
        with:
          path: estado.enc
          key: afk-estado-${{ env.MODO_AFK == 'prueba' && 'prueba' || 'real' }}-${{ github.run_id }}
          restore-keys: afk-estado-${{ env.MODO_AFK == 'prueba' && 'prueba' || 'real' }}-

      - name: Instalar (Java, Postgres, jar, Minecraft)
        working-directory: deploy/vps
        env:
          GITHUB_TOKEN: ${{ secrets.MINECADIA_READ_TOKEN }}
        run: |
          start=$(date +%s)
          ./instalar-nativo.sh > ../../instalar.log 2>&1 || { tail -30 ../../instalar.log; exit 1; }
          ./bots.sh instalar > ../../instalar2.log 2>&1 || { tail -30 ../../instalar2.log | grep -v -i token; exit 1; }
          test -s data/mod/minecadia.jar
          echo "instalado en $(( $(date +%s) - start )) s"

      - name: Guardar Minecraft para la proxima tanda
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: deploy/vps/data/shared
          key: afk-mc-forge-1.8.9-v1

      - name: Recuperar el estado (almacen, login, logs)
        working-directory: deploy/vps
        run: |
          . ../../.clave
          if [ -s ../../estado.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AFK_CLAVE -in ../../estado.enc | tar xz
            if [ "${{ inputs.set_nuevo }}" = true ]; then echo "set nuevo: no recupero el almacen (se carga AFK_OBJETIVO de cero)"
            elif [ -s estado/almacen.sql ]; then psql -q -v ON_ERROR_STOP=0 -f estado/almacen.sql > /dev/null 2>&1; fi
            for r in solo vigia; do [ -d estado/$r ] && { mkdir -p data/$r; cp -a estado/$r/. data/$r/; }; done
            # el nombre de la cuenta sale del login (device-login no escribe "cuenta" y bots.sh lo pide)
            for r in solo vigia; do [ -s data/$r/msa.json ] && [ ! -s data/$r/cuenta ] && python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['accounts'][0]['username'])" data/$r/msa.json > data/$r/cuenta 2>/dev/null; done; true
            [ -f estado/proxys/cache.tsv ] && { mkdir -p data/proxys; cp estado/proxys/cache.tsv data/proxys/; echo "cache de proxys: $(wc -l < data/proxys/cache.tsv) que ya entraron"; }
            cp estado/tanda ../../tanda-anterior 2>/dev/null || true
            echo "estado recuperado: tanda $(cat estado/tanda 2>/dev/null || echo ?), $(psql -At -c 'select count(*) from bom' 2>/dev/null || echo 0) lineas de set"
            rm -rf estado
          else
            echo "sin estado anterior: arranca de cero"
          fi
          bash ../../afk-resumen.sh || true

      - name: solo-cli y comandos de la rama de control (una vez por cambio)
        if: env.MODO_AFK != 'login'
        working-directory: deploy/vps
        run: |
          set -f
          [ -d data/src/pipeline ] || { echo "AVISO: no esta el codigo del pipeline, sin solo-cli"; exit 0; }
          command -v gradle >/dev/null || { echo "AVISO: no hay gradle, sin solo-cli"; exit 0; }
          J=${JAVA_HOME_21_X64:-$JAVA_HOME}
          JAVA_HOME=$J gradle -q --no-daemon -p data/src/pipeline soloCliJar > ../../solo-cli-build.log 2>&1 \
            || { echo "AVISO: no se armo solo-cli"; tail -15 ../../solo-cli-build.log | grep -vi token; exit 0; }
          cp "$(find data/src/pipeline/build -name solo-cli.jar | head -1)" data/solo-cli.jar && echo "solo-cli listo"
          f=/tmp/control/afk/comandos.txt
          [ -s $f ] || { echo "sin comandos"; exit 0; }
          [ "${{ inputs.set_nuevo }}" = true ] && rm -f data/solo/comandos.sha
          h=$(sha256sum $f | cut -c1-64)
          if [ "$h" = "$(cat data/solo/comandos.sha 2>/dev/null)" ]; then echo "comandos sin cambios: no se repiten"; exit 0; fi
          grep -vE '^\s*(#|$)' $f | while IFS= read -r c; do
            echo "> $c"; $J/bin/java -jar data/solo-cli.jar --pg jdbc:postgresql://127.0.0.1:5432/pipeline --user pipeline --pass pipeline $c 2>&1 | head -40 | sed 's/^/  /'
          done
          mkdir -p data/solo; echo "$h" > data/solo/comandos.sha

      - name: JDK 8 para el emulador
        if: env.MODO_AFK == 'prueba'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restaurar Spigot 1.8.8
        if: env.MODO_AFK == 'prueba'
        uses: actions/cache/restore@v4
        with:
          path: spigot
          key: spigot-1.8.8-v1

      - name: Server de prueba (emulador)
        if: env.MODO_AFK == 'prueba'
        run: |
          J8=$JAVA_HOME/bin
          mkdir -p spigot bt
          if [ ! -f spigot/spigot-1.8.8.jar ]; then (cd bt && curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar && $J8/java -jar BuildTools.jar --rev 1.8.8 > bt.log 2>&1 && cp spigot-1.8.8*.jar ../spigot/spigot-1.8.8.jar) || { echo "no se pudo armar Spigot"; tail -20 bt/bt.log 2>/dev/null; exit 1; }; fi
          (cd tools/MinecadiaEmu && mkdir -p out && $J8/javac -encoding UTF-8 -cp ../../spigot/spigot-1.8.8.jar -d out src/main/java/net/minecadia/emu/*.java && $J8/jar cf MinecadiaEmu.jar -C out . -C src/main/resources .)
          mkdir -p server/plugins/MinecadiaEmu; cp spigot/spigot-1.8.8.jar server/; cp tools/MinecadiaEmu/MinecadiaEmu.jar server/plugins/
          E2E=tools/MinecadiaEmu/e2e
          sed -E 's/^(\s+)Sniper:/\1Solo:/; s/players: \[Sniper\]/players: [Solo]/' $E2E/config-clon-leggings.yml > server/plugins/MinecadiaEmu/config.yml
          # sin cofres en el mundo: las botellas y la basura de la base van a /pv 1 y /pv 14 (base.fill queda para check.py)
          python3 - server/plugins/MinecadiaEmu/config.yml <<'PY'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          fill = lambda role: (re.search(r"\n    " + role + r":\s*(\[[^\]]*\])", s) or [None, "[]"])[1]
          pv = '\npv:\n  count: 15\n  size: 54\n  fill:\n    "1": %s\n    "14": %s\n' % (fill("BOTTLES"), fill("STORAGE"))
          s = re.sub(r"(\n  chests: )\[[^\]]*\]", r"\1[]", s, count=1) + pv
          open(p, "w").write(s)
          PY
          grep -A5 '^pv:' server/plugins/MinecadiaEmu/config.yml
          cd server; echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=FLAT\ngenerate-structures=false\nspawn-protection=0\nspawn-monsters=false\nspawn-animals=false\nview-distance=4\nmax-players=10\n' > server.properties
          mkfifo console; nohup sleep infinity > console 2>/dev/null &
          nohup $J8/java -Xmx1G -jar spigot-1.8.8.jar nogui < console > server.log 2>&1 &
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done; grep -q "Done (" server.log && echo "emulador listo"

      - name: Guardar Spigot 1.8.8
        if: env.MODO_AFK == 'prueba' && hashFiles('spigot/spigot-1.8.8.jar') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: spigot
          key: spigot-1.8.8-v1

      - name: Login Microsoft (una vez)
        if: env.MODO_AFK == 'login'
        working-directory: deploy/vps
        env:
          AFK_COOKIES: ${{ secrets.AFK_COOKIES }}
          AFK_COOKIES_VIGIA: ${{ secrets.AFK_COOKIES_VIGIA }}
        run: |
          ROL=${{ inputs.cuenta || 'solo' }}; mkdir -p data/$ROL
          CK="$AFK_COOKIES"; [ "$ROL" = vigia ] && [ -n "$AFK_COOKIES_VIGIA" ] && CK="$AFK_COOKIES_VIGIA"
          if [ -s /tmp/control/afk/login/$ROL.ms ]; then
            # token de Microsoft ya aprobado a mano (codigo de microsoft.com/link) que dejo Claude en la rama de control privada
            python3 ../../tools/login/cookie-login.py --ms-refresh /tmp/control/afk/login/$ROL.ms --out data/$ROL/msa.json > /tmp/l.log 2>&1; rc=$?
            grep -E '^(login|token de)' /tmp/l.log; [ $rc = 0 ] || { tail -1 /tmp/l.log | cut -c1-160; exit 1; }
          fi
          if [ ! -s data/$ROL/msa.json ] && [ -n "$CK" ]; then
            # intento con las cookies de la sesion de Microsoft (sin clave); si no alcanzan, cae al device code
            umask 077; printf '%s\n' "$CK" > /tmp/ck.txt
            python3 ../../tools/login/cookie-login.py --cookies /tmp/ck.txt --out data/$ROL/msa.json --timeout 300 || echo "las cookies no alcanzaron: voy al codigo"
            rm -f /tmp/ck.txt
          fi
          if [ ! -s data/$ROL/msa.json ]; then
            # device code: imprime una sola linea "CODIGO <xxxx>"; Claude la lee del log y te la pasa, vos aprobas una vez
            python3 ../../tools/login/device-login.py --out data/$ROL/msa.json --timeout 840
          fi
          test -s data/$ROL/msa.json && echo "login guardado para $ROL"
          [ -s data/$ROL/msa.json ] && python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['accounts'][0]['username'])" data/$ROL/msa.json > data/$ROL/cuenta
          # guardar el login en el estado cifrado aunque esta sea solo la tanda de login
          . ../../.clave 2>/dev/null || true
          if [ -n "${AFK_CLAVE:-}" ]; then bash ../../afk-guardar.sh ../../estado.enc 2>&1 | grep -i login || true; fi

      - name: Proxys (vigia)
        if: env.MODO_AFK != 'login'
        working-directory: deploy/vps
        env:
          AFK_PROXIES: ${{ secrets.AFK_PROXIES }}
          AFK_PROXY_FUENTES: ${{ secrets.AFK_PROXY_FUENTES || vars.AFK_PROXY_FUENTES }}
          AFK_PROXY_TIPO: ${{ vars.AFK_PROXY_TIPO }}
        run: |
          D=$PWD/data/proxys; mkdir -p $D; chmod 700 $D
          if [ "$MODO_AFK" = prueba ]; then
            # proxys de prueba: uno con clave que corta cada sesion a los 150 s, uno http sano, uno muerto y uno
            # que llega por una lista servida por http (como un repo de proxys)
            P=../../tools/proxy
            nohup python3 $P/proxy-prueba.py 31080 socks5 --user u --clave c --echa-a 150 > /dev/null 2>&1 &
            nohup python3 $P/proxy-prueba.py 31081 http > /dev/null 2>&1 &
            nohup python3 $P/proxy-prueba.py 31082 socks5 > /dev/null 2>&1 &
            mkdir -p /tmp/lista; printf '127.0.0.1:31082\n10.255.255.1:1080\n' > /tmp/lista/socks5.txt
            (cd /tmp/lista && nohup python3 -m http.server 31800 > /dev/null 2>&1 &)
            AFK_PROXIES=$'socks5://u:c@127.0.0.1:31080\nhttp://127.0.0.1:31081\nsocks5://127.0.0.1:31083'
            AFK_PROXY_FUENTES=http://127.0.0.1:31800/socks5.txt
            SERVER=127.0.0.1:25565
            echo MINECADIA_PROXY_TUNNEL_LOCAL=1 >> $GITHUB_ENV
            echo -e "VIGIA=1\nCUENTA_VIGIA=Vigia" >> config/bots.env
          else
            # listas publicas de la rama de control privada si no hay secret/variable; se releen cada 40 min
            [ -n "$AFK_PROXY_FUENTES" ] || AFK_PROXY_FUENTES=$(grep -E '^https?://' /tmp/control/afk/proxy-fuentes.txt 2>/dev/null || true)
            export AFK_PROXY_RELEER=${AFK_PROXY_RELEER:-2400}
            if [ -z "$AFK_PROXIES" ] && [ -z "$AFK_PROXY_FUENTES" ]; then echo "sin proxys: la cuenta entra con la IP de GitHub"; exit 0; fi
            SERVER=$(grep '^SERVER=' config/bots.env | cut -d= -f2-)
            if [ -s data/vigia/msa.json ]; then echo VIGIA=1 >> config/bots.env; echo "cuenta vigia: si"; else echo "cuenta vigia: no (modo login, cuenta vigia, para sumarla)"; fi
          fi
          export AFK_PROXIES AFK_PROXY_FUENTES
          nohup python3 ../../tools/proxy/proxy-vigia.py --dir $D --server "$SERVER" > ../../proxy-vigia.log 2>&1 &
          echo "MINECADIA_PROXY_POOL=$D" >> $GITHUB_ENV
          for i in $(seq 1 60); do [ -s $D/comprador.tsv ] && break; sleep 10; done
          grep -m1 '^vigia:' ../../proxy-vigia.log || true
          [ -s $D/comprador.tsv ] && echo "proxys listos" || echo "AVISO: todavia ningun proxy sano; la cuenta espera sin conectarse"

      - name: Correr el bot
        if: env.MODO_AFK != 'login'
        working-directory: deploy/vps
        env:
          PIPELINE_ORDENES: ${{ github.workspace }}/deploy/vps/data/solo/ordenes.txt
          TOKEN: ${{ secrets.MINECADIA_READ_TOKEN }}
          GHT: ${{ github.token }}
        run: |
          set +e
          # ordenes a mano: afk/ordenes.txt de la rama de control privada, releida cada minuto; el bot corre cada linea
          # nueva una vez (ver Ordenes.kt) y aca se muestran sus respuestas "[ORDEN]"
          H="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          traer_ordenes() {
            [ "$MODO_AFK" = prueba ] && return
            d=$(mktemp -d); git -C "$d" init -q
            if git -C "$d" -c http.extraheader="$H" fetch -q --depth 1 --no-tags https://github.com/reidethebest/minecadia-client.git "$AFK_CONTROL" 2>/dev/null \
               && git -C "$d" show FETCH_HEAD:afk/ordenes.txt > "$d/o" 2>/dev/null; then mkdir -p data/solo; cp "$d/o" data/solo/ordenes.txt; fi
            rm -rf "$d"
          }
          vistas=0
          mostrar_ordenes() {
            r=$(cat data/solo/logs/cliente-*.out 2>/dev/null | grep -a '\[ORDEN\]' | sed 's/.*\[ORDEN\]/[ORDEN]/')
            n=$(printf '%s' "$r" | grep -c . || true)
            [ "$n" -gt "$vistas" ] && printf '%s\n' "$r" | tail -n +$((vistas + 1)); [ "$n" -lt "$vistas" ] || vistas=$n
          }
          # avisos: un comentario en el PR de la rama "avisos" (solo numeros, nada privado: el repo es publico).
          # Cada aviso sale una vez por tanda. Claude esta suscripto a ese PR y se despierta con el comentario.
          avisar() {
            [ "$MODO_AFK" = correr ] || { echo "[AVISO] $2"; return; }
            grep -qx "$1" /tmp/avisados 2>/dev/null && return
            echo "$1" >> /tmp/avisados; echo "[AVISO] $2"
            pr=$(GH_TOKEN=$GHT gh pr list --repo "$GITHUB_REPOSITORY" --head avisos --state open --json number -q '.[0].number' 2>/dev/null)
            [ -n "$pr" ] && GH_TOKEN=$GHT gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "AVISO $1: $2 (tanda $GITHUB_RUN_ID, minuto $((now / 60)))" > /dev/null 2>&1
          }
          revisar_avisos() {
            if [ $now -ge 600 ] && [ -s data/proxys/estado.json ]; then
              px=$(python3 -c "import json;e=json.load(open('data/proxys/estado.json'));print('%d candidatos, %d sanos, %d para usar, mediana %s ms' % (e['candidatos'], e['sanos'], e['comprador'], e['ms_mediana']))" 2>/dev/null)
              ul=$(psql -At -c "select extract(epoch from now() - max(at))::int from event where bot like '%solo%'" 2>/dev/null)
              avisar ARRANCO "10 min andando; proxys: ${px:-sin datos}; ultimo latido hace ${ul:-?} s"
            fi
            bot=$(psql -At -c "select coalesce(sum(split_part(l, E'\t', 2)::int), 0) from snapshot, regexp_split_to_table(contents, E'\n') l where l like 'BOTTLE|%'" 2>/dev/null)
            pend=$(psql -At -c "select coalesce(sum(qty - made), 0) from rune_order where state not in ('DONE', 'CANCELLED') and made < qty" 2>/dev/null)
            nro=$(psql -At -c "select count(*) from rune_order" 2>/dev/null)
            [ "$bot" = 0 ] && [ -n "$pend" ] && [ "$pend" != 0 ] && avisar SIN_BOTELLAS "no quedan botellas y faltan $pend runas (cargar mas en /pv 1)"
            [ "${nro:-0}" != 0 ] && [ "$pend" = 0 ] && avisar RUNAS_LISTAS "todas las runas pedidas estan al 100% y guardadas"
            l=$(psql -At -c "select extract(epoch from now() - max(at))::int from event where bot like '%solo%'" 2>/dev/null)
            [ -n "$l" ] && [ "$l" -gt 900 ] && avisar QUIETO "el bot no da senales hace $((l / 60)) min (desconectado o trabado)"
            [ $now -gt 300 ] && ! pgrep -f portablemc > /dev/null && avisar CAIDO "el cliente de Minecraft se cerro"
            c=$(ls -t data/solo/logs/cliente-*.out 2>/dev/null | head -1)
            [ -n "$c" ] && ne=$(grep -ac 'Exception' "$c") && [ "$ne" -gt 200 ] && avisar ERRORES "el cliente lleva $ne errores (Exception) en el log"
          }
          traer_ordenes
          HORAS='${{ inputs.horas || '5.5' }}'
          if [ "$MODO_AFK" = prueba ]; then HORAS=0.12; fi
          LIMITE=$(python3 -c "print(int(min(float('$HORAS'), 5.5) * 3600))")
          ./bots.sh revisar > /tmp/rev.txt 2>&1; echo "revisar: salio $?"; grep -av -i "server=" /tmp/rev.txt | tail -15
          ./bots.sh arrancar > /tmp/arr.txt 2>&1 || { echo "no arranco:"; grep -av -i "server=" /tmp/arr.txt | tail -15; exit 1; }
          echo "bot prendido por $LIMITE s"
          t0=$(date +%s)
          if [ "$MODO_AFK" = prueba ]; then
            # prueba de ordenes: se escriben con el bot andando; abre un /pv a mano, mira y cierra
            ( sleep 150; mkdir -p data/solo; printf '# prueba\nver\nchat /pv 15\nesperar 2\nver\ncerrar\ninv\nnoexiste\n' > data/solo/ordenes.txt ) &
          fi
          while true; do
            sleep 60; now=$(( $(date +%s) - t0 ))
            traer_ordenes; mostrar_ordenes; revisar_avisos
            [ $(( now % 900 )) -lt 60 ] && bash ../../afk-resumen.sh
            left=$(psql -At -c "select count(*) from bom where applied < required" 2>/dev/null)
            if [ "$left" = "0" ] && [ "$(psql -At -c 'select count(*) from bom' 2>/dev/null)" != "0" ]; then echo "set completo a los $now s"; touch ../../set-completo; break; fi
            [ $now -ge $LIMITE ] && { echo "fin de la tanda ($now s)"; break; }
          done
          bash ../../afk-resumen.sh
          if [ "$MODO_AFK" = prueba ]; then
            # solo en la prueba (emulador, nada real): que hizo el cliente, para ver por que no avanzo
            cat data/solo/logs/cliente-*.out 2>/dev/null | grep -a -E '\[PIPELINE\]|\[ChestZones\]|\[ORDEN\]|\[E2E\]|Exception' | grep -v 'estado ' | sed 's/^.*\] \[/[/' | tail -60
            # donde cae un NullPointerException (solo nombres de metodo y linea, sin codigo)
            cat data/solo/logs/cliente-*.out 2>/dev/null | grep -a -A14 'Caused by: java.lang.NullPointerException' | grep -a -oE 'at net\.minecadia[A-Za-z0-9_.$]*\([A-Za-z0-9_.]*:[0-9]+\)' | sort | uniq -c | sort -rn | head -12
            [ "$(psql -At -c 'select count(*) from bom' 2>/dev/null)" != "0" ] || { echo "FALLA: el bot nunca cargo el objetivo (no termino de prepararse)"; exit 1; }
          fi

      - name: Prueba - corte de tanda (guarda, borra todo, recupera y sigue)
        if: env.MODO_AFK == 'prueba'
        working-directory: deploy/vps
        run: |
          set +e
          . ../../.clave
          ./bots.sh parar > /dev/null 2>&1
          bash ../../afk-guardar.sh ../../estado.enc && test -s ../../estado.enc || { echo "FALLA: no se guardo el estado"; exit 1; }
          antes=$(psql -At -c "select count(*) from purchase")
          psql -q -c "drop schema public cascade; create schema public;" 2>/dev/null; rm -rf data/solo
          echo "borrado: $(psql -At -c 'select count(*) from information_schema.tables where table_schema=$$public$$') tablas, data/solo $(ls data/solo 2>/dev/null | wc -l) archivos"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AFK_CLAVE -in ../../estado.enc | tar xz
          psql -q -f estado/almacen.sql > /dev/null 2>&1; mkdir -p data/solo; cp -a estado/solo/. data/solo/; rm -rf estado
          despues=$(psql -At -c "select count(*) from purchase" 2>/dev/null)
          echo "recuperado: $despues de $antes compras"; bash ../../afk-resumen.sh
          [ "$despues" = "$antes" ] || { echo "FALLA: el almacen no volvio igual"; exit 1; }
          ./bots.sh arrancar > /dev/null 2>&1 || exit 1
          t0=$(date +%s)
          for i in $(seq 1 300); do
            sleep 10
            left=$(psql -At -c "select count(*) from bom where applied < required" 2>/dev/null)
            if [ "$left" = "0" ] && [ "$(psql -At -c 'select count(*) from bom')" != "0" ]; then echo "set completo $(( $(date +%s) - t0 )) s despues del corte"; touch ../../set-completo; break; fi
          done
          sleep 30
          bash ../../afk-resumen.sh

      - name: Apagar con las compras cerradas y guardar el estado (cifrado)
        if: always() && env.MODO_AFK != 'prueba'
        working-directory: deploy/vps
        run: |
          . ../../.clave
          [ -x bots.sh ] || exit 0
          ./bots.sh parar > /dev/null 2>&1 || true
          bash ../../afk-guardar.sh ../../estado.enc

      - name: Guardar el estado para la tanda siguiente
        if: always() && env.MODO_AFK != 'prueba' && hashFiles('estado.enc') != ''
        uses: actions/cache/save@v4
        with:
          key: afk-estado-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: estado.enc

      - name: Prueba - chequeo del emulador
        if: env.MODO_AFK == 'prueba'
        run: |
          echo stop > server/console; for i in $(seq 1 60); do pgrep -f spigot-1.8.8.jar >/dev/null || break; sleep 2; done
          test -f set-completo || { echo "FALLA: el set no se completo"; exit 1; }
          E2E_ORCH=Solo E2E_BUYER=Solo E2E_CLIENTS=solo python3 tools/MinecadiaEmu/e2e/check.py server/plugins/MinecadiaEmu deploy/vps/config/objetivo.set
          # proxys: cada conexion del comprador paso por un proxy (o espero sin conectarse), y el vigia entro por alguno
          # el corte de tanda borra data/solo y solo recupera el ultimo .out (logs-anteriores): junto todos los .out que haya
          find deploy/vps/data/solo -name '*.out' -exec cat {} + > /tmp/c.out 2>/dev/null || true
          find deploy/vps/data/vigia -name '*.out' -exec cat {} + > /tmp/v.out 2>/dev/null || true
          echo "logs: comprador $(wc -l < /tmp/c.out) lineas, vigia $(wc -l < /tmp/v.out) lineas"
          con=$(grep -ac 'Connecting to' /tmp/c.out || true); uso=$(grep -ac '\[PROXY\] uso' /tmp/c.out || true); esp=$(grep -ac 'ningun proxy sano' /tmp/c.out || true)
          echo "comprador: $con conexiones, $uso por proxy, $esp esperando, $(grep -ac '\[PROXY\] .* malo' /tmp/c.out) proxys caidos, $(grep -ac 'entro bien' /tmp/c.out) entradas buenas"
          echo "vigia: $(grep -ac '\[PROXY\] uso' /tmp/v.out) conexiones, $(grep -ac 'entro bien' /tmp/v.out) entradas buenas, $(grep -ac '\[PROXY\] .* malo' /tmp/v.out) caidos"
          grep -m3 'vigia:' proxy-vigia.log || true
          [ "$con" -gt 0 ] && [ $(( uso + esp )) -ge "$con" ] || { echo "FALLA: el comprador se conecto sin proxy"; exit 1; }
          grep -aq 'entro bien' /tmp/v.out || { echo "FALLA: la cuenta vigia nunca entro por un proxy"; exit 1; }
          grep -aq '\[PROXY\] .* malo' /tmp/c.out || echo "aviso: el comprador no llego a caerse de ningun proxy en esta prueba"
          # /pv en vez de cofres: el bot abrio los /pv (lo anota el emulador) y no hay cofres en el mundo
          pvs=$(grep -a ' pv Solo ' server/plugins/MinecadiaEmu/events.log | awk '$NF != 15' | wc -l)
          echo "/pv abiertos por el bot: $pvs ($(grep -a ' pv Solo ' server/plugins/MinecadiaEmu/events.log | awk '{print $NF}' | sort -n | uniq -c | tr -s ' ' | tr '\n' ';'))"
          [ "$pvs" -gt 0 ] || { echo "FALLA: el bot nunca abrio un /pv"; exit 1; }
          # ordenes a mano: las corrio y contesto
          grep -a '\[ORDEN\]' /tmp/c.out | sed 's/.*\[ORDEN\]/[ORDEN]/' | head -40
          grep -aq "\[ORDEN\] ventana 'Vault #15'" /tmp/c.out || { echo "FALLA: la orden 'chat /pv 15' + 'ver' no mostro el /pv 15"; exit 1; }
          grep -aq "\[ORDEN\] no entiendo 'noexiste'" /tmp/c.out || { echo "FALLA: una orden desconocida no se aviso"; exit 1; }

      - name: Aviso de fin de tanda
        if: always() && env.MODO_AFK == 'correr'
        env:
          GH_TOKEN: ${{ github.token }}
          ESTADO: ${{ job.status }}
          SIGUE: ${{ (vars.AFK_ON == '1' || env.SEGUIR == '1') && hashFiles('set-completo') == '' }}   # solo si sale bien
        run: |
          if [ "$ESTADO" != success ]; then m="FALLO: la tanda termino con estado $ESTADO (mirar los pasos en rojo)"
          elif [ "$SIGUE" != true ]; then m="FIN: la tanda termino y no hay siguiente (seguir apagado o set completo)"
          else exit 0; fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head avisos --state open --json number -q '.[0].number' 2>/dev/null)
          [ -n "$pr" ] && gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "AVISO $m (tanda $GITHUB_RUN_ID)" || true
          echo "$m"

      - name: Lanzar la tanda siguiente
        if: success() && env.MODO_AFK == 'correr' && (vars.AFK_ON == '1' || env.SEGUIR == '1') && hashFiles('set-completo') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run afk-actions.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f modo=correr -f horas='${{ inputs.horas || '5.5' }}'
          echo "tanda siguiente lanzada (arranca cuando termine esta)"
